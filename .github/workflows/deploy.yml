name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Serialize uploads to the robthefritz Pages project. Never cancel a running
# production deploy (or any in-flight upload) when a newer run is queued.
concurrency:
  group: pages-robthefritz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=robthefritz --branch=main

  preview:
    # Same-repo PRs into main only. Never --branch=main (that is production).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PAGES_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Guard preview branch
        run: |
          set -eu
          if [ -z "${PAGES_BRANCH}" ] || [ "${PAGES_BRANCH}" = "main" ]; then
            echo "Refusing Pages preview for branch '${PAGES_BRANCH:-empty}'" >&2
            exit 1
          fi
          # Keep the value a single @actions/exec argv token after wrangler-action
          # concatenates `command` (spawn, no shell — but whitespace still splits).
          case "${PAGES_BRANCH}" in
            *[!A-Za-z0-9._/-]*)
              echo "Preview branch contains unsupported characters: ${PAGES_BRANCH}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action concatenates this into `npx wrangler <command>` and
          # tokenizes with @actions/exec (child_process.spawn, no shell).
          # toJSON keeps the env-provided branch one argv even if it had spaces;
          # the guard step already rejected main and unsafe characters.
          command: pages deploy public --project-name=robthefritz --branch=${{ toJSON(env.PAGES_BRANCH) }}

      - name: Comment preview URL
        if: steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const botLogin = 'github-actions[bot]';
            const previewUrl = process.env.PREVIEW_URL || '';
            let parsed;
            try {
              parsed = new URL(previewUrl);
            } catch {
              core.info('Skipping comment: wrangler-action did not return a valid preview URL.');
              return;
            }
            if (parsed.protocol !== 'https:') {
              core.info('Skipping comment: preview URL is not https.');
              return;
            }

            const body = [
              marker,
              '## Cloudflare Pages preview',
              '',
              `[${parsed.href}](${parsed.href})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === botLogin &&
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
